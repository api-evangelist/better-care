- version: 3.17.0
  date: '2026-07-08'
  compatible_form_renderer: 3.17.0
  breaking: true
  highlights:
  - AQL builder AI assistant renamed/upgraded to "Bea"; it can now combine queries into a JS View and return JavaScript instead of a single AQL query.
