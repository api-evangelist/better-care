aid: better-care
name: Better
description: >-
  Better (formerly Marand, Ljubljana, Slovenia) is a digital-health vendor whose products are built
  on openEHR, the open standard for vendor-neutral, computable clinical data. Better Platform is an
  openEHR-compliant clinical data repository (CDR) and operational data repository that exposes the
  openEHR ITS-REST API together with AQL (Archetype Query Language) for querying stored compositions.
  Better Studio is the low-code environment used to build clinical forms, AQL queries, JavaScript
  views, ETL pipelines and data connectors against that platform; Better Meds is an ePMA for
  medication management; Better Design System and the Better Marketplace supply reusable widgets,
  forms and bundles. Better publishes its core openEHR reference libraries — web-template, ehr-common
  and the openEHR REST conformance test suite — as Apache-2.0 open source on GitHub and Maven Central,
  but the Better Platform API reference itself is served behind Microsoft Entra single sign-on.
