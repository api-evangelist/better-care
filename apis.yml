apis:
- name: Better Platform openEHR REST API
  description: >-
    Better Platform's clinical data repository exposes the openEHR ITS-REST API (EHR, COMPOSITION,
    DIRECTORY, CONTRIBUTION, TEMPLATE/definition and QUERY/AQL resources) plus Better's own
    web-template and simplified-JSON extensions. Better publishes an Apache-2.0 conformance test
    suite (care.better.platform.test:openehr-rest-tests) that exercises the specification's
    OPTIONS conformance call and basic authentication against a deployed server. The reference
    documentation is served behind Microsoft Entra single sign-on and no OpenAPI is published.
  humanURL: https://docs.better.care/platform/
  x-base-url-status: >-
    No public base URL. Better Platform is deployed per customer (private cloud or on-premise), so
    the openEHR REST endpoint is tenant-specific; the openehr-rest-tests suite requires the
    integrator to supply `openehr.rest.uri` themselves. No host was guessed.
  tags:
  - openEHR
  - Clinical Data Repository
  - Health
  properties:
  - type: Conformance
    url: conformance/better-care-conformance.yml
  - type: Authentication
    url: authentication/better-care-authentication.yml
